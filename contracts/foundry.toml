[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200

# Golden vectors are the shared source of truth for forge and the TS engine mirror;
# the test harness reads them and the GenVectorHashes script writes hashes.json here.
# The canonical test reads the pinned creation code from ../deployments/v1; nothing
# in this project writes there.
fs_permissions = [
    { access = "read-write", path = "../packages/vectors" },
    { access = "read", path = "../deployments" },
    # Deployed bytecode of a P-256 verifier, so the owner tests run a real curve check.
    { access = "read", path = "./test/fixtures" },
]

# The account is compiled through the IR pipeline: it is the one contract that needs the
# size and the stack room. Everything else stays on the legacy pipeline it was tested on.
additional_compiler_profiles = [{ name = "olien", via_ir = true, optimizer_runs = 1 }]
compilation_restrictions = [{ paths = "src/**", via_ir = true }]

# 32k calls per invariant. Below the defaults so the suite stays usable during
# development; the handler swallows reverts, so afterInvariant asserts the run
# actually reached paid, disputed, attested and settled states rather than passing
# on an empty sequence.
[invariant]
runs = 128
depth = 256
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
